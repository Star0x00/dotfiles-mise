[tools]
pi = "latest"

# ---- CLI / editors ----
jq = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
bat = "latest"
gh = "latest"
yazi = "latest"
just = "latest"
pandoc = "latest"
fastfetch = "latest"
btop = "latest"
starship = "latest"
helix = { backend = "aqua", version = "latest" } # helix-editor/helix
# flyline: bash 增强 shared library (libflyline.so)，非可执行二进制，用 bash enable -f 加载
"github:HalFrgrd/flyline" = "latest"
"github:vercel-labs/fx" = "0.0.13" # fx: gitignore'd/unix-like coding agent
# codesnap: pure-rust code-snapshot renderer, driven by the `codesnap` Gram task.
"github:codesnap-rs/codesnap" = "0.14.0"

# ---- runtimes / toolchains ----
nodejs = "latest"
zig = "latest"
uv = "latest"
typst = "latest"
tree-sitter = "latest"

# ---- LSPs ----
zls = "latest"
lua-language-server = "latest"
tinymist = "latest"
stylua = "latest"
"pipx:ww-manager" = "latest"

npm = "latest"
tealdeer = "latest"
eza = "latest"
lazygit = "latest"
neovim = "latest"
pnpm = "latest"
superfile = "latest"
jujutsu = "latest"
"npm:@deepseek-ai/dsh" = "0.1.7-rc.2"
delta = "latest"
"github:exercism/cli" = "latest"
"aqua:numtide/treefmt" = "latest"
glow = "latest"
"github:Star0x00/wwm" = "latest"

[settings]
dotfiles.default_mode = "copy"

[settings.npm]
package_manager = "npm"

[dotfiles]
"~/.Xresources" = "~/dotfiles/.Xresources"
"~/.bash_profile" = "~/dotfiles/.bash_profile"

# ---- home root files (native dotfiles) ----
"~/.bashrc" = "~/dotfiles/.bashrc"
"~/.config/bat" = "~/dotfiles/bat"
"~/.config/environment.d/10-mise.conf" = "~/dotfiles/environment.d/10-mise.conf"

# fonts: nothing is managed here — the install-fonts task fetches every family
# declared in fonts/installer/fonts.toml into ~/.local/share/fonts.
"~/.config/fish/config.fish" = "~/dotfiles/fish/config.fish"
"~/.config/flow" = "~/dotfiles/flow"
"~/.config/fontconfig/fonts.conf" = "~/dotfiles/fontconfig/fonts.conf"
"~/.config/ghostty/config" = "~/dotfiles/ghostty/config"
"~/.config/ghostty/gtk.css" = "~/dotfiles/ghostty/gtk.css"
"~/.config/go-musicfox" = "~/dotfiles/go-musicfox"
"~/.config/helix" = "~/dotfiles/helix"
"~/.config/hypr" = "~/dotfiles/hypr"
"~/.config/jj/config.toml" = "~/dotfiles/jj/config.toml"
"~/.config/kitty/catppuccin_mocha.conf" = "~/dotfiles/kitty/catppuccin_mocha.conf"
"~/.config/kitty/gruvbox_material_dark.conf" = "~/dotfiles/kitty/gruvbox_material_dark.conf"
"~/.config/kitty/kanagawa_dragon.conf" = "~/dotfiles/kitty/kanagawa_dragon.conf"

# kitty: theme + quake quick-access config (main file must be named kitty.conf, not config)
"~/.config/kitty/kitty.conf" = "~/dotfiles/kitty/kitty.conf"
"~/.config/kitty/tokyonight_night.conf" = "~/dotfiles/kitty/tokyonight_night.conf"
"~/.config/mimeapps.list" = "~/dotfiles/mimeapps.list"

# ---- mise self-management ----
# config.toml lives in the dotfiles repo; a symlink keeps the repo in sync automatically.
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise/config.toml", mode = "symlink" }
"~/.config/mpv" = "~/dotfiles/mpv"
"~/.config/niri" = "~/dotfiles/niri"

# gram (Zed fork): symlink so the GUI's settings/keymap edits write through to the repo
"~/.config/gram" = { source = "~/dotfiles/gram", mode = "symlink" }
# codesnap: theme = Catppuccin-Mocha, font = Iosevka Star (see dotfiles/codesnap/config.json)
"~/.config/codesnap/config.json" = { source = "~/dotfiles/codesnap/config.json", mode = "symlink" }

"~/.config/nushell/config.nu" = "~/dotfiles/nushell/config.nu"
"~/.config/nushell/env.nu" = "~/dotfiles/nushell/env.nu"
# NOTE: keep every entry as a FLAT key under [dotfiles] — short syntax
# "path" = "source" (default mode) or inline table "path" = { source=..., mode=... }.
# Do NOT open [dotfiles."path"] sub-tables: per TOML's current-table rule that
# swallows every following flat key into the sub-table, silently unmanaging
# everything after it (this bit us once).

# ---- app configs (dotfiles repo, whole dir or file) ----
# nvim: symlink on purpose so lazy.nvim's nvim-pack-lock.json writes through to the repo
"~/.config/nvim" = { source = "~/dotfiles/nvim", mode = "symlink" }

"~/.config/starship.toml" = "~/dotfiles/starship.toml"
"~/.config/superfile" = "~/dotfiles/superfile"
"~/.config/sway/color_01.icc" = "~/dotfiles/sway/color_01.icc"
"~/.config/sway/colors" = "~/dotfiles/sway/colors" # stylix snapshot

"~/.config/sway/config" = "~/dotfiles/sway/config"
"~/.config/sway/config.d" = "~/dotfiles/sway/config.d"
# niri session PATH: mise shims available to niri and everything it spawns.
"~/.config/systemd/user/niri.service.d/10-mise-path.conf" = { source = "~/dotfiles/systemd/user/niri.service.d/10-mise-path.conf", mode = "symlink" }

# ---- systemd user units ----
"~/.config/systemd/user/ssh-add-pass.service" = { source = "~/dotfiles/systemd/user/ssh-add-pass.service", mode = "symlink" }
"~/.config/umbriel" = "~/dotfiles/umbriel"

"~/.config/xdg-desktop-portal/portals.conf" = "~/dotfiles/xdg-desktop-portal/portals.conf"
"~/.config/yt-dlp" = "~/dotfiles/yt-dlp"

# fx: custom OpenAI-compatible provider (DeepSeek) + Exa MCP. Keys come from pass.
# fx rejects symlinked/hardlinked config, so these stay plain copies.
"~/.fx/settings.json" = "~/dotfiles/fx/settings.json"
"~/.fx/mcp.json" = "~/dotfiles/fx/mcp.json"

# ---- vcs (git / jujutsu) ----
"~/.gitconfig" = "~/dotfiles/git/.gitconfig"
"~/.npmrc" = "~/dotfiles/.npmrc"

# pi agent: global instructions (symlink so edits in ~/.pi write through to the repo)
"~/.pi/agent/AGENTS.md" = { source = "~/dotfiles/pi/agent/AGENTS.md", mode = "symlink" }
"~/.pi/agent/extensions/tool-ui" = "~/dotfiles/pi/agent/extensions/tool-ui"

# pi agent: global extensions (~/.pi/agent/extensions), one dir per extension
"~/.pi/agent/extensions/toolbox" = "~/dotfiles/pi/agent/extensions/toolbox"
"~/.pi/agent/mcp.json" = { source = "~/dotfiles/pi/agent/mcp.json", mode = "symlink" }

# pi agent: settings + mcp servers (symlink so in-session /settings and /mcp edits write through)
"~/.pi/agent/settings.json" = { source = "~/dotfiles/pi/agent/settings.json", mode = "symlink" }

# pi agent: themes + tool-ui palette
"~/.pi/agent/themes" = "~/dotfiles/pi/agent/themes"
"~/.pi/agent/tool-ui.json" = "~/dotfiles/pi/agent/tool-ui.json"

[tasks]
status-dotfiles = "mise bootstrap dotfiles status"

[tasks.apply-dotfiles]
description = "Apply dotfiles, installing any missing font first"
depends = ["install-fonts"]
run = ["mise bootstrap dotfiles apply", "mise run enable-user-units", "mise run flatpak-overrides"]

[tasks.enable-user-units]
description = "Enable the systemd user units shipped by dotfiles (idempotent)"
run = [
  # `systemctl --user` needs the user manager to be reachable; skip outside a session.
  "[ -S ${XDG_RUNTIME_DIR}/bus ] || exit 0",
  "systemctl --user daemon-reload",
  "systemctl --user enable ssh-add-pass.service",
]

# Flatpak apps get their own HOME, so host fonts / GTK / Qt themes are invisible
# unless explicitly shared. The global override is rebuilt from scratch each run
# (--reset) so stale or wrong entries (e.g. the old ~/.local/fonts) never linger.
[tasks.flatpak-overrides]
description = "Grant Flatpak apps access to host fonts, GTK/Qt themes and XDG user dirs"
run = [
  "command -v flatpak >/dev/null || exit 0",
  "flatpak override --user --reset",
  '''flatpak override --user \
  --filesystem=~/.local/share/fonts:ro \
  --filesystem=~/.config/fontconfig:ro \
  --filesystem=~/.config/gtk-3.0:ro \
  --filesystem=~/.config/gtk-4.0:ro \
  --filesystem=~/.themes:ro \
  --filesystem=~/.local/share/themes:ro \
  --filesystem=~/.icons:ro \
  --filesystem=~/.local/share/icons:ro \
  --filesystem=~/.config/qt5ct:ro \
  --filesystem=~/.config/qt6ct:ro \
  --filesystem=~/.config/Kvantum:ro \
  --filesystem=xdg-desktop \
  --filesystem=xdg-documents \
  --filesystem=xdg-download \
  --filesystem=xdg-music \
  --filesystem=xdg-pictures \
  --filesystem=xdg-videos''',
]

[tasks.install-fonts]
description = "Download the fonts declared in fonts/installer/fonts.toml into ~/.local/share/fonts"
# Task-local toolchain: `go` is only needed by this task, not the whole config.
tools.go = "latest"
# The Go module lives in its own dir, so run from there instead of the repo root.
# config_root is $HOME for this global config, hence the explicit dotfiles path.
dir = "~/dotfiles/fonts/installer"
# Extra flags go through `mise run install-fonts -- -force`.
run = "go run ."
