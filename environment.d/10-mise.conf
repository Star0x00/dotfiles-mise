# ~/.config/environment.d/10-mise.conf — systemd user session environment
# GUI apps started by the session manager get these variables.
#
# ONLY put compositor-agnostic variables here. startplasma-wayland imports
# this file into the Plasma session (it only filters DISPLAY / XAUTHORITY /
# WAYLAND_DISPLAY / WAYLAND_SOCKET / XDG_*), so setting QT_QPA_PLATFORM=wayland
# here gets inherited by the systemd-managed kwin_wayland. KWin then tries to
# start as a Qt Wayland *client* instead of taking the DRM backend, never
# connects (no WAYLAND_DISPLAY), and the Plasma session hangs on login.
#
# Wayland/compositor-specific vars (QT_QPA_PLATFORM, QT_QPA_PLATFORMTHEME,
# GDK_BACKEND, SDL_VIDEODRIVER, CLUTTER_BACKEND, WLR_RENDERER,
# SWAY_UNSUPPORTED_GPU, QT_IM_MODULES, XDG_SESSION_TYPE) live in the
# compositor's own config instead:
#   niri -> ~/.config/niri/config/env.kdl
#   sway -> ~/.config/sway/config.d/env
#   hypr -> ~/.config/hypr/modules/env.lua

PATH=$HOME/.local/bin:$HOME/.local/share/npm/bin:$HOME/.bin:$PATH

TERMINFO_DIRS=/etc/terminfo:/usr/share/terminfo:/lib/terminfo

XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24
XCURSOR_PATH=$HOME/.local/share/icons:$HOME/.icons:/usr/share/icons

BROWSER=chrome
EDITOR=hx

MOZ_ENABLE_WAYLAND=1

XMODIFIERS=@im=fcitx
INPUT_METHOD=fcitx
SDL_IM_MODULE=fcitx

SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/ssh-agent.socket
