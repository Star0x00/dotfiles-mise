# flow: hand-edited overrides
#
# Referenced from ~/.config/flow/config via:
#   include_files "/var/home/qwerhyy/.config/flow/include.conf"
#
# flow rewrites ~/.config/flow/config on every interactive settings change, but
# it never modifies an included file (see the header of the main config). Keep
# anything you want to survive there, not in the main config.
#
# The path in include_files must be absolute: flow 0.7.2 panics on "~/x", "$HOME/x"
# and relative paths (verified on this machine).

frame_rate 170
theme "mocha"
light_theme "mocha"
input_mode "vim"
enable_terminal_color_scheme false
terminal_TERM "xterm-ghostty"
inline_vcs_blame true
completion_trigger "every_keystroke"
palette_style "compact"
home_style "compact"
hint_window_style "bar_left"
info_box_style "rounded_boxed"
palette_placement "center"
