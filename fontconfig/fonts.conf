<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Default font families</description>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>Iosevka Curly</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
  <!-- Concrete families requested by name beat the generic aliases above. QQ's font
       stack names MiSans, so installing MiSans hijacked its UI text. Prefer the same
       family here; MiSans stays as fallback. -->
  <alias binding="same">
    <family>MiSans</family>
    <prefer>
      <family>Maple Mono NF CN</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
