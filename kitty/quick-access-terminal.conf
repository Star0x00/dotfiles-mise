# quick-access-terminal (quake-style drop-down) — kitty config
# Managed via dotfiles (linked by mise).
# Auto-loaded from ~/.config/kitty/quick-access-terminal.conf by the
# `kitten quick-access-terminal` kitten.

# Drop-down panel on the top edge, 40% of screen height
edge top
lines 18
layer overlay
# opacity comes from niri's window-rule, not from kitty (see kitty.conf)
background_opacity 1

# Give the panel focus on open; hide when it loses focus
focus_policy on-demand
hide_on_focus_loss no
# (theme/fonts are inherited from the normal kitty.conf by default)