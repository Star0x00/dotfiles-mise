# kitty configuration
# Managed via dotfiles (linked by mise)

# ---- Font (monospace + CJK fallback), sized up for readability ----
font_family      Iosevka Curly, Sarasa Term SC
font_size        16.0

# ---- Theme: Catppuccin Mocha ----
# include kanagawa_dragon.conf
# include gruvbox_material_dark.conf
# include tokyonight_night.conf
include catppuccin_mocha.conf

# ---- Appearance ----
# Keep kitty's own background opaque: niri's window-rule sets the terminal
# opacity (rules.kdl, `opacity 0.9`) and blurs the wallpaper behind it. Two
# alphas multiply (0.9 x 0.78), which is what made text look washed out.
background_opacity    1
cursor_shape          block
cursor_blink_interval 0.5
window_padding_width  4
tab_bar_style         powerline
tab_bar_min_tabs      1
hide_window_decorations title-bar-only
copy_on_select        clipboard

enabled_layouts splits:split_axis=horizontal

# ---- Keybindings ----
# window navigation / close
map ctrl+shift+h      neighboring_window left
map ctrl+shift+j      neighboring_window down
map ctrl+shift+k      neighboring_window up
map ctrl+shift+l      neighboring_window right
map ctrl+shift+w      close_window

# split windows:  |  vertical, -  horizontal
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map ctrl+shift+up layout_action move_to_screen_edge top
map ctrl+shift+left layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down layout_action move_to_screen_edge bottom

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down


# font scaling (kitty default ctrl+shift+- for decrease collides with hsplit -> use < >)
map ctrl+shift+period    increase_font_size
map ctrl+shift+comma     decrease_font_size
map ctrl+shift+backspace restore_font_size
