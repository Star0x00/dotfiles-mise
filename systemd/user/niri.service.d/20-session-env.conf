[Service]
# Session-wide environment for everything niri spawns. Lives here instead of
# ~/.config/environment.d because niri-session runs `systemctl --user
# import-environment` from greetd, which overwrites the manager environment that
# environment.d builds; unit-level Environment= is applied afterwards and wins.
#
# PATH is in 10-mise-path.conf. Everything the compositor itself owns stays in
# ~/.config/niri/config/env.kdl: EDITOR, MOZ_ENABLE_WAYLAND, XMODIFIERS,
# INPUT_METHOD, SDL_IM_MODULE, QT_*/GDK_*/SDL_VIDEODRIVER/CLUTTER_BACKEND and
# XDG_SESSION_* — niri sets those for its children and override these.
# ssh-agent.socket is our own unit, so the agent socket is not the ssh default
Environment=SSH_AUTH_SOCK=%t/ssh-agent.socket
Environment=TERMINFO_DIRS=/etc/terminfo:/usr/share/terminfo:/lib/terminfo
Environment=XCURSOR_THEME=Bibata-Modern-Ice
Environment=XCURSOR_SIZE=24
Environment=XCURSOR_PATH=%h/.local/share/icons:%h/.icons:/usr/share/icons
Environment=EDITOR=flow
