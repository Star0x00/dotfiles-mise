[signing]
behavior = "own"
backend = "gpg"
key = "F77F927ECB45E6A18F500EB46AD98F52998B0DE2"

[ui]
editor = "nvim"
pager = ["delta", "--line-numbers", "--side-by-side", "--syntax-theme", "Catppuccin Mocha"]
diff-formatter = ":git"

# hunk.nvim as the interactive diff editor, used by `jj split -i`,
# `jj squash -i` and `jj diffedit`. Requires the nvim config to define
# `HunkDiffEditor` (see dotfiles/nvim/lua/plugins/init.lua).
diff-editor = ["nvim", "-c", "HunkDiffEditor $left $right $output"]
# Don't inject the JJ-INSTRUCTIONS buffer into the diff editor.
diff-instructions = false

# ---- megamerge workflow -------------------------------------------------------
# One octopus merge ("megamerge") whose parents are every line of work you care
# about, so the working copy is always the sum of all of it and conflicts show up
# in your face instead of after a PR lands. The megamerge itself is never pushed;
# only the branches it composes are.
# https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit

[revset-aliases]
# closest merge commit at or above `to` (the megamerge, for `to = @`)
"closest_merge(to)" = "heads(::to & merges())"

[aliases]
# `jj stack <revset>`: insert that revset between trunk() and the megamerge
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]
# `jj stage`: same, fed with whatever already sits above the megamerge
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
# `jj restack`: move *only* the commits we own onto trunk(), leave other people's
# branches (and work stacked on them) untouched. rebase --onto trunk() instead
# stops at the first immutable commit.
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]

