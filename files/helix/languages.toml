[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }
language-servers = [ "nixd" ]

[language-server.nixd]
command = "nixd"

[language-server.nixd.config.nixd.formatting]
command = ["nixfmt"]

# Packages and lib completion. The dotfiles flake pins nixpkgs, there is no channel.
[language-server.nixd.config.nixd.nixpkgs]
expr = "import (builtins.getFlake \"/var/home/qwerhyy/dotfiles\").inputs.nixpkgs { }"

# Option completion (`file.home`, `flatpak.apps`, ...); `options` is exported by
# flake.nix from the same module eval nix-maid builds, so it cannot drift.
[language-server.nixd.config.nixd.options.maid]
expr = "(builtins.getFlake \"/var/home/qwerhyy/dotfiles\").options"

[[language]]
name = "json"
auto-format = true
formatter = { command = "biome", args = ["format", "--stdin-file-path", "%{buffer_name}"] }
language-servers = [ "vscode-json-language-server" ]

[[language]]
name = "json"
language-servers = [ { name = "vscode-json-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "dockerfile"
auto-format = true
