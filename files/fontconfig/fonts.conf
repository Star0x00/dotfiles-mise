<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Default font families</description>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Sarasa Fixed SC</family>
      <family>Maple Mono NF CN</family>
      <family>Iosevka Curly</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Sarasa UI SC</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Sarasa UI SC</family>
      <!-- <family>MiSans</family> -->
    </prefer>
  </alias>
   <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
